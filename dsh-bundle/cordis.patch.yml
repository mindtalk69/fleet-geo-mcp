# Template - fill the two placeholders, then install this bundle.
#   <node.exe>  the DSH runtime node:  $env:DSH_NODE_EXECUTABLE
#   <repo>      absolute path to this checkout
- insert:
    - id: fleet-geo-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: fleetgeo
        transport: stdio
        command: '<node.exe>'
        args:
          - '<repo>/server.mjs'
        cwd: '<repo>'
        failOnStartupError: false
