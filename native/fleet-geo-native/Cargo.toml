[package]
name = "fleet-geo-native"
version = "1.2.0"
edition = "2021"
license = "MIT"
description = "Encore-style Rust N-API native core for fleet-geo-mcp: kernel RFC 1792 TCP/UDP MIB, dual-stack LPM radix trie, and zero-copy protocol parsers."

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_System_Diagnostics_ToolHelp",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
strip = "symbols"
